<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
// =====================
// Navigation & Navbar
// =====================
// Smooth scrolling for navigation links
const navLinks = document.querySelectorAll('.nav-link');
document.querySelectorAll('a[href^="#"]').forEach(anchor => {
    anchor.addEventListener('click', function (e) {
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
            e.preventDefault();
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    });
});

// Add hover effects to navigation links
navLinks.forEach(link => {
    link.addEventListener('mouseenter', function() {
        this.style.transform = 'translateY(-2px)';
    });
    link.addEventListener('mouseleave', function() {
        this.style.transform = 'translateY(0)';
    });
});

// Navbar background on scroll
window.addEventListener('scroll', function() {
    const navbar = document.querySelector('.navbar');
    if (navbar) {
        if (window.scrollY > 50) {
            navbar.style.backgroundColor = 'rgba(248, 246, 240, 0.95)';
            navbar.style.backdropFilter = 'blur(10px)';
            navbar.style.transition = 'all 0.3s ease';
        } else {
            navbar.style.backgroundColor = 'transparent';
            navbar.style.backdropFilter = 'none';
        }
    }
});

// =====================
// Logo Animation
// =====================
const logo = document.getElementById('logo');
if (logo) {
    logo.addEventListener('click', function(e) {
        e.preventDefault();
        this.style.transform = 'rotate(360deg)';
        this.style.transition = 'transform 0.6s ease';
        setTimeout(() => {
            this.style.transform = 'rotate(0deg)';
        }, 600);
    });
}

// =====================
// Section Scroll Links
// =====================
const scrollLinks = [
    { id: 'aboutLink', target: 'about' },
    { id: 'experienceLink', target: 'experience' },
    { id: 'contactLink', target: 'contact' }
];
scrollLinks.forEach(link => {
    const el = document.getElementById(link.id);
    const targetSection = document.getElementById(link.target);
    if (el && targetSection) {
        el.addEventListener('click', function(e) {
            e.preventDefault();
            targetSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            // Close mobile menu if open
            // The following lines were removed as per the edit hint:
            // if (navbarCollapse && navbarCollapse.classList.contains('show') && navbarToggler) {
            //     navbarToggler.click();
            // }
        });
    }
});

// =====================
// Section Animations (Intersection Observer)
// =====================
function animateOnIntersect(selector, callback, options) {
    const section = document.querySelector(selector);
    if (!section) return;
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) callback(entry.target);
        });
    }, options);
    observer.observe(section);
}

// About section animation
animateOnIntersect('.about-section', (section) => {
    const aboutTitle = section.querySelector('.about-title');
    const aboutParagraphs = section.querySelectorAll('.about-paragraph');
    if (aboutTitle) aboutTitle.classList.add('animate');
    aboutParagraphs.forEach((p, i) => setTimeout(() => p.classList.add('animate'), i * 200));
}, { threshold: 0.2, rootMargin: '0px 0px -50px 0px' });

// Experience section animation
animateOnIntersect('.experience-section', (section) => {
    const experienceLabel = section.querySelector('.experience-label');
    const experienceItems = section.querySelectorAll('.experience-item');
    const resumeBtn = section.querySelector('.resume-btn');
    if (experienceLabel) experienceLabel.classList.add('animate');
    experienceItems.forEach((item, i) => setTimeout(() => item.classList.add('animate'), i * 150));
    if (resumeBtn) setTimeout(() => resumeBtn.classList.add('animate'), experienceItems.length * 150 + 300);
}, { threshold: 0.2, rootMargin: '0px 0px -50px 0px' });

// Testimonials section animation
animateOnIntersect('.testimonials-section', (section) => {
    const testimonialsTitle = section.querySelector('.testimonials-title');
    const testimonialItems = section.querySelectorAll('.testimonial-item');
    if (testimonialsTitle) testimonialsTitle.classList.add('animate');
    testimonialItems.forEach((item, i) => setTimeout(() => item.classList.add('animate'), i * 200));
}, { threshold: 0.2, rootMargin: '0px 0px -50px 0px' });

// Contact section animation
animateOnIntersect('.contact-button-container', (section) => {
    const contactBtn = section.querySelector('.contact-btn');
    if (contactBtn) contactBtn.classList.add('animate');
}, { threshold: 0.5, rootMargin: '0px 0px -50px 0px' });

// Footer animation
animateOnIntersect('.footer-section', (section) => {
    section.classList.add('animate');
}, { threshold: 0.3, rootMargin: '0px 0px -50px 0px' });

// Fade-in elements (generic)
const fadeEls = document.querySelectorAll('.fade-in, .fade-in-delay');
if (fadeEls.length) {
    const fadeObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.style.opacity = '1';
                entry.target.style.transform = 'translateY(0)';
            }
        });
    }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
    fadeEls.forEach(el => fadeObserver.observe(el));
}

// =====================
// Button & Link Handlers
// =====================
// Resume button click animation
const resumeBtn = document.getElementById('viewResumeBtn');
if (resumeBtn) {
    resumeBtn.addEventListener('click', function() {
        this.style.transform = 'scale(0.95)';
        setTimeout(() => {
            this.style.transform = 'translateY(-2px)';
        }, 150);
        // Add resume download/modal logic here if needed
    });
}

// Get In Touch button click handler
const getInTouchBtn = document.getElementById('getInTouchBtn');
if (getInTouchBtn) {
    getInTouchBtn.addEventListener('click', function() {
        this.style.transform = 'scale(0.95)';
        setTimeout(() => {
            this.style.transform = 'translateY(-2px)';
        }, 150);
        window.location.href = "mailto:niranjangupta.jun3@gmail.com?subject=Let\'s Connect";
    });
}

// Email link click handler
const emailLink = document.getElementById('emailLink');
if (emailLink) {
    emailLink.addEventListener('click', function(e) {
        e.preventDefault();
        window.location.href = "mailto:niranjangupta.jun3@gmail.com?subject=Let\'s Connect";
    });
}

// LinkedIn link click handler (placeholder)
const linkedinLink = document.getElementById('linkedinLink');
if (linkedinLink) {
    linkedinLink.addEventListener('click', function() {
        // Add LinkedIn logic if needed
    });
}

// =====================
// Back to Top Button
// =====================
const backToTopBtn = document.getElementById('backToTopBtn');
if (backToTopBtn) {
    window.addEventListener('scroll', function() {
        if (window.scrollY > 500) {
            backToTopBtn.style.opacity = '0.7';
            backToTopBtn.style.pointerEvents = 'auto';
        } else {
            backToTopBtn.style.opacity = '0';
            backToTopBtn.style.pointerEvents = 'none';
        }
    });
    backToTopBtn.addEventListener('click', function() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });
}

// Navbar collapse on mobile when link is clicked
const navbarCollapse = document.getElementById('navbarContent');
if (navbarCollapse) {
    navLinks.forEach(link => {
        link.addEventListener('click', () => {
            if (window.innerWidth < 992) {
                const bsCollapse = bootstrap.Collapse.getOrCreateInstance(navbarCollapse);
                bsCollapse.hide();
            }
        });
    });
}
</script>
